name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install streamlit deep-translator gTTS google-genai pydantic requests beautifulsoup4 pdfplumber python-docx python-dotenv pytest ruff
      - run: ruff check .
      - run: pytest -q
